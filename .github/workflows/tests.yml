name: Tests

# Regression guard: runs the full pytest suite on every PR and on every push
# to the default branch. Independent of the MigGuard review workflow so PRs
# that don't touch .sql files still get test coverage.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MigGuard
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
