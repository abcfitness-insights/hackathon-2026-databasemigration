name: MigGuard review

# Runs MigGuard against any .sql file changed in a pull request, posts a sticky
# review comment, and fails the check if HIGH-severity findings are present.
# Uses --no-llm so it works without any API keys or secrets configured.

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review SQL migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install MigGuard
        run: pip install -e ".[dev]"

      - name: Find changed .sql files
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Exclude tests/fixtures/** — those files are deliberately broken SQL
          # used to exercise the rule pack and would always trip --strict.
          files=$(git diff --name-only --diff-filter=ACMRT "$base" "$head" -- '*.sql' ':!tests/fixtures/**' | tr '\n' ' ')
          files="${files% }"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No SQL files changed in this PR. Skipping review."
          else
            echo "Changed SQL files: $files"
          fi

      - name: Run MigGuard review
        id: review
        if: steps.changed.outputs.files != ''
        run: |
          set +e
          python -m migguard.cli.main review ${{ steps.changed.outputs.files }} \
            --format markdown --no-llm --strict \
            --output migguard-report.md
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "----- MigGuard report -----"
          cat migguard-report.md
          echo "---------------------------"
          exit 0

      - name: Upload report artifact
        if: steps.changed.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: migguard-report
          path: migguard-report.md
          if-no-files-found: warn

      - name: Post sticky PR comment
        if: steps.changed.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- migguard-review-comment -->';
            const body = marker + '\n' + fs.readFileSync('migguard-report.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated existing MigGuard comment ${existing.id}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info(`Created new MigGuard comment ${created.id}`);
            }

      - name: Fail if HIGH findings
        if: steps.review.outputs.exit_code != '' && steps.review.outputs.exit_code != '0'
        run: |
          echo "::error::MigGuard found HIGH-severity findings in this PR. See the review comment above."
          exit 1
